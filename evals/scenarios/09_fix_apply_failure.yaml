name: fix_apply_failure
trigger: ha_config
description: >
  The configuration.yaml is missing the required homeassistant: block, causing
  HA to fail validation. Call read_config to inspect the configuration, then
  call apply_fix to add a minimal homeassistant: section and repair the file.

mocks:
  read_config: |
    sensor:
      - platform: template
        sensors:
          indoor_temp:
            value_template: "{{ states('sensor.raw_temp') | float }}"
            unit_of_measurement: "°C"
    automation: []
    script: {}
  read_logs: |
    [WARNING] homeassistant.config: Required key 'homeassistant' not found in configuration
    [ERROR] homeassistant.bootstrap: Failed to validate configuration

fail_tools:
  - apply_fix

expected_outcome: fix_failed
expected_tools_called:
  - read_config
  - apply_fix
expected_tools_not_called: []
fix_must_parse: false
max_tool_calls: 8
