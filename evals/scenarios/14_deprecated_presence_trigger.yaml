name: deprecated_presence_trigger
trigger: ha_config
description: >
  An automation uses the `entered_home` device trigger type for a person entity.
  This trigger type was removed in HA 2026.5. The agent must replace it with a
  state trigger using `to: home`.

mocks:
  read_config: |
    homeassistant:
      name: My Home
    automation:
      - alias: Welcome home
        trigger:
          - platform: device
            domain: person
            entity_id: person.alice
            type: entered_home
        action:
          - service: light.turn_on
            target:
              entity_id: light.entrance
  read_logs: |
    [ERROR] homeassistant.setup: Failed to set up automation 'Welcome home': Unsupported trigger type 'entered_home' for domain 'person'. This trigger type was removed in 2026.5.
    [ERROR] homeassistant.components.automation: Automation 'Welcome home' failed to initialize

expected_outcome: success
expected_tools_called:
  - read_config
  - apply_fix
  - finish_repair
expected_tools_not_called: []
fix_must_parse: true
max_tool_calls: 10
