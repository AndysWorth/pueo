<!DOCTYPE html>
<html lang="en">
  <head>

    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
      initial-scale=1.0">
    <title>Pueo</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon_16.svg">
    <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; padding: 1.5rem; }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; color: #333; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .card-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem; }
    .badge { font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.05em; }
    .badge-pending  { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }
    .badge-approved { background: #d1e7dd; color: #0a3622; border: 1px solid #28a745; }
    .badge-rejected { background: #f8d7da; color: #58151c; border: 1px solid #dc3545; }
    .badge-deferred { background: #e0e7ff; color: #3730a3; border: 1px solid #6366f1; }
    .subject { font-weight: 600; font-size: 1rem; }
    .elapsed { font-size: 0.8rem; color: #888; margin-left: auto; }
    .body { font-size: 0.9rem; color: #444; margin-bottom: 0.5rem; white-space: pre-wrap; }
    .meta { font-size: 0.8rem; color: #666; margin-bottom: 0.5rem; }
    details { margin-bottom: 0.75rem; }
    summary { font-size: 0.8rem; color: #555; cursor: pointer; }
    .actions { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    .btn { padding: 0.35rem 1rem; font-size: 0.85rem; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    .btn-approve { background: #28a745; color: #fff; }
    .btn-approve:hover { background: #218838; }
    .btn-reject  { background: #dc3545; color: #fff; }
    .btn-reject:hover  { background: #c82333; }
    .btn-defer   { background: #6366f1; color: #fff; }
    .btn-defer:hover   { background: #4f46e5; }
    .spinner { display: inline-block; width: 1rem; height: 1rem; border: 2px solid #ccc; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .in-progress-label { font-size: 0.85rem; color: #555; vertical-align: middle; }
    :root { --red: #dc3545; --orange: #fd7e14; }
    .empty { color: #888; font-size: 0.9rem; text-align: center; padding: 2rem; }
    .section-label { display: inline-block; font-size: 0.68rem; font-weight: 700; padding: 0.15rem 0.45rem; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.06em; margin-right: 0.4rem; }
    .label-evidence  { background: #dbeafe; color: #1d4ed8; }
    .label-diagnosis { background: #dcfce7; color: #166534; }
    .label-llm       { background: #fef3c7; color: #92400e; }
    .kv-grid { display: grid; grid-template-columns: max-content 1fr; gap: 0.2rem 0.75rem; font-size: 0.78rem; margin-top: 0.4rem; }
    .kv-grid .k { color: #555; font-weight: 600; }
    .kv-grid .v { color: #222; word-break: break-word; }
    pre { font-size: 0.78rem; background: #f8f8f8; border: 1px solid #e0e0e0; border-radius: 4px; padding: 0.6rem; overflow-x: auto; margin-top: 0.4rem; white-space: pre-wrap; }
    .nav-link { color: #555; text-decoration: none; font-weight: 600; font-size: 0.9rem;
      padding-bottom: 3px; border-bottom: 2px solid transparent; }
    .nav-link.active { color: #1a73e8; border-bottom-color: #1a73e8; }
    .nav-link:hover { color: #1a73e8; }
    .ha-badge { font-size: 0.72rem; font-weight: 700; padding: 0.18rem 0.55rem;
      border-radius: 10px; display: inline-flex; align-items: center; gap: 0.35rem;
      white-space: nowrap; border: 1px solid; }
    .ha-badge::before { content: ''; display: inline-block; width: 7px; height: 7px;
      border-radius: 50%; flex-shrink: 0; }
    .ha-badge-online       { background: #d1e7dd; color: #0a3622; border-color: #28a745; }
    .ha-badge-online::before      { background: #28a745; }
    .ha-badge-unreachable  { background: #f8d7da; color: #58151c; border-color: #dc3545; }
    .ha-badge-unreachable::before { background: #dc3545; }
    .ha-badge-auth         { background: #fff3cd; color: #856404; border-color: #ffc107; }
    .ha-badge-auth::before        { background: #ffc107; }
    .ha-badge-unknown      { background: #e9ecef; color: #666;    border-color: #adb5bd; }
    .ha-badge-unknown::before     { background: #adb5bd; }
  </style>
  </head>
  <body>
    <h1><img src="/static/nav_32.png" title="Pueo" alt="Pueo" width="32"
        height="32">&nbsp;Pueo</h1>
    {% set p = request.url.path %}
    <nav style="margin-bottom:1.25rem;display:flex;gap:1.25rem;align-items:center;">
      <a class="nav-link{% if p == '/' %} active{% endif %}" href="/">Overview</a>
      <a class="nav-link{% if p.startswith('/queue') %} active{% endif %}" href="/queue">Queue</a>
      <a class="nav-link{% if p.startswith('/timeline') %} active{% endif %}" href="/timeline">Timeline</a>
      <a class="nav-link{% if p.startswith('/backups') %} active{% endif %}" href="/backups">Backups</a>
      <a class="nav-link{% if p.startswith('/disk') %} active{% endif %}" href="/disk">Disk</a>
      <a class="nav-link{% if p.startswith('/notifications') %} active{% endif %}" href="/notifications">Notifications</a>
      <a class="nav-link{% if p.startswith('/settings') %} active{% endif %}" href="/settings">Settings</a>
      <a class="nav-link{% if p.startswith('/control') %} active{% endif %}" href="/control">Control</a>
      <a class="nav-link{% if p.startswith('/episodes') %} active{% endif %}" href="/episodes">Episodes</a>
      <a class="nav-link{% if p.startswith('/chat') %} active{% endif %}" href="/chat">Chat</a>
      <span style="margin-left:auto;">
        <span id="ha-status-badge" class="ha-badge ha-badge-unknown">HA ?</span>
      </span>
    </nav>
    {% block content %}{% endblock %}
    <script>
    (function () {
      function updateHaStatus() {
        fetch('/ha-status')
          .then(function (r) { return r.json(); })
          .then(function (d) {
            var b = document.getElementById('ha-status-badge');
            if (!b) return;
            if (d.reachable && !d.auth_error) {
              b.className = 'ha-badge ha-badge-online';
              b.textContent = 'HA online' + (d.version ? ' · ' + d.version : '');
            } else if (d.reachable && d.auth_error) {
              b.className = 'ha-badge ha-badge-auth';
              b.textContent = 'HA: auth error';
            } else {
              b.className = 'ha-badge ha-badge-unreachable';
              b.textContent = 'HA unreachable';
            }
          })
          .catch(function () {
            var b = document.getElementById('ha-status-badge');
            if (b) { b.className = 'ha-badge ha-badge-unreachable'; b.textContent = 'HA unreachable'; }
          });
      }
      updateHaStatus();
      setInterval(updateHaStatus, 30000);
    })();
    </script>
  </body>
</html>
